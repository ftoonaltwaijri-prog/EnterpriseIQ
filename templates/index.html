<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EnterpriseIQ Dashboard</title><style>body{font-family:system-ui;background:#0b1220;color:#e2e8f0;margin:0}main{max-width:1100px;margin:auto;padding:35px 20px}h1{color:#a5b4fc}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:15px}.card{background:#1e293b;padding:22px;border:1px solid #334155;border-radius:16px}.value{font-size:29px;font-weight:700;color:#67e8f9}table{width:100%;border-collapse:collapse}td,th{padding:12px;text-align:left;border-bottom:1px solid #334155}button{background:#6366f1;color:white;padding:11px 19px;border:0;border-radius:9px;cursor:pointer}a{color:#93c5fd}input{padding:10px}</style><main><h1>EnterpriseIQ</h1><p>Enterprise Analytics & Decision Intelligence Platform · Flask + SQLite · Synthetic demo dataset</p><div class="cards" id="kpis"></div><div class="cards"><div class="card"><h2>Revenue by Region</h2><div id="regions"></div></div><div class="card"><h2>Category Performance</h2><div id="categories"></div></div></div><div class="card"><h2>Recent Transactions</h2><table><thead><tr><th>Order</th><th>Date</th><th>Region</th><th>Product</th><th>Revenue (SAR)</th></tr></thead><tbody id="recent"></tbody></table></div><div class="card"><h2>Data Operations</h2><p id="forecast"></p><form id="form"><input required type="file" id="csv" accept=".csv"><button>Import CSV</button></form><p id="message"></p><a href="/api/export">Export all sales as CSV</a></div></main><script>
const money=v=>'SAR '+Number(v||0).toLocaleString('en-US',{maximumFractionDigits:2});
async function load(){const [s,f]=await Promise.all([fetch('/api/summary').then(r=>r.json()),fetch('/api/forecast').then(r=>r.json())]);const t=s.totals;document.querySelector('#kpis').innerHTML=[['Revenue',money(t.revenue)],['Profit',money(t.profit)],['Orders',t.orders],['Margin',t.margin_pct+'%']].map(([a,b])=>'<div class="card"><div>'+a+'</div><div class="value">'+b+'</div></div>').join('');document.querySelector('#regions').innerHTML=s.regions.map(x=>'<p>'+x.region+': '+money(x.revenue)+'</p>').join('');document.querySelector('#categories').innerHTML=s.categories.map(x=>'<p>'+x.category+': '+money(x.revenue)+'</p>').join('');document.querySelector('#recent').innerHTML=s.recent.map(x=>'<tr><td>'+x.order_id+'</td><td>'+x.date+'</td><td>'+x.region+'</td><td>'+x.product+'</td><td>'+money(x.revenue)+'</td></tr>').join('');document.querySelector('#forecast').textContent='Next-month baseline estimate: '+money(f.estimated_next_month_revenue)+' ('+f.method+')';}document.querySelector('#form').onsubmit=async e=>{e.preventDefault();let d=new FormData();d.append('file',document.querySelector('#csv').files[0]);let r=await fetch('/api/upload',{method:'POST',body:d});let j=await r.json();document.querySelector('#message').textContent=r.ok?'Imported '+j.imported+' rows':j.error;if(r.ok)await load()};load();
</script></html>
